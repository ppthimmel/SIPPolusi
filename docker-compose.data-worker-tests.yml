# Local test services only. The database has no published port or persistent volume.
name: sippolusi-data-worker-tests
services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: ./src/data_worker
      dockerfile: Dockerfile.test
    image: sippolusi-data-worker-tests:local
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    volumes:
      - .:/workspace
