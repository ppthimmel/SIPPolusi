# Isolated local verification only. Credentials are disposable fixture values.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: spatial_test
      POSTGRES_PASSWORD: spatial_test
      POSTGRES_DB: spatial_test
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spatial_test -d spatial_test"]
      interval: 3s
      timeout: 3s
      retries: 30
  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: spatial_test
      MINIO_ROOT_PASSWORD: spatial_test_password
      MINIO_DEFAULT_BUCKETS: mlflow,feature-store
    ports: ["127.0.0.1:19000:9000"]
  model_registry:
    build: ./src/model_registry
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://spatial_test:spatial_test@postgres:5432/spatial_test?options=-csearch_path=mlflow
      MLFLOW_ARTIFACT_ROOT: s3://mlflow/artifacts
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: spatial_test
      AWS_SECRET_ACCESS_KEY: spatial_test_password
    ports: ["127.0.0.1:15000:5000"]
