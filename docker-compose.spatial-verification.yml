# Isolated local verification only. Credentials are disposable fixture values.
services:
  postgres:
    # Same version and data directory as docker-compose.yml and the Railway database.
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: spatial_test
      POSTGRES_PASSWORD: spatial_test
      POSTGRES_DB: spatial_test
      PGDATA: /var/lib/postgresql/data/pgdata
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      # Over TCP: the temporary server of the init phase listens on the Unix socket only, and
      # model_registry has no restart policy to recover from connecting before init has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U spatial_test -d spatial_test"]
      interval: 3s
      timeout: 3s
      retries: 30
  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: spatial_test
      MINIO_ROOT_PASSWORD: spatial_test_password
      MINIO_DEFAULT_BUCKETS: mlflow,feature-store
    ports: ["127.0.0.1:19000:9000"]
  # Proxied artifacts, as on Railway and in docker-compose.yml: clients need only
  # MLFLOW_TRACKING_URI, and only this service holds the object-storage keys.
  model_registry:
    build: ./src/model_registry
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://spatial_test:spatial_test@postgres:5432/spatial_test?options=-csearch_path=mlflow
      MLFLOW_ARTIFACT_ROOT: mlflow-artifacts:/
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow/artifacts
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: spatial_test
      AWS_SECRET_ACCESS_KEY: spatial_test_password
    ports: ["127.0.0.1:15000:5000"]
