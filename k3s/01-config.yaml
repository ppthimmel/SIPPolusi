apiVersion: v1
kind: ConfigMap
metadata:
  name: sippolusi-config
  namespace: sippolusi
data:
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "sippolusi"

---
apiVersion: v1
kind: Secret
metadata:
  name: sippolusi-secrets
  namespace: sippolusi
type: Opaque
stringData:
  # In a real environment, replace these with secure secrets (e.g., SealedSecrets or external secret manager)
  POSTGRES_PASSWORD: "super-secure-password"
  DATABASE_URL: "postgresql://postgres:super-secure-password@postgis.sippolusi.svc.cluster.local:5432/sippolusi"
