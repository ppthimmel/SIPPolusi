worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name localhost;

        # Route requests to the backend service
        location /v1/routes {
            # In Railway private network, the domain is typically the service name
            # Replace backend.railway.internal with the actual internal domain
            proxy_pass http://backend.railway.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route requests for spatial data if exposed
        location /v1/exposure-surface {
            proxy_pass http://backend.railway.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /health {
            return 200 'API Gateway is healthy\n';
        }
    }
}
