# Example Alertmanager config with an email receiver. Copy it, fill in the SMTP account, and store it as the
# Secret Manager secret alertmanager-config (scripts/gcp/README.md); never commit the filled-in file.
# Any Alertmanager receiver works the same way (discord_configs, telegram_configs, webhook_configs, ...).
global:
  smtp_smarthost: smtp.gmail.com:587
  smtp_from: sippolusi-alerts@example.com
  smtp_auth_username: sippolusi-alerts@example.com
  smtp_auth_password: <app password>
  smtp_require_tls: true

route:
  receiver: team
  group_by: [alertname, service_name, job, probe, pollutant]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers: ['alertname="Watchdog"']
      receiver: blackhole

receivers:
  - name: team
    email_configs:
      - to: team@example.com
        send_resolved: true
  - name: blackhole

inhibit_rules:
  - source_matchers: ['alertname="EndpointProbeFailed"']
    target_matchers: ['alertname=~"HighErrorRate|ErrorRateAboveTarget|RouteLatencyP95.*"']
