# Example Alertmanager config with an email receiver (Gmail SMTP). Copy it, fill in the addresses, and store it as
# the Secret Manager secret alertmanager-config (scripts/gcp/README.md); never commit the filled-in file.
# The SMTP password is not in this file: it is the secret alertmanager-smtp-password, mounted at the path below.
# Any Alertmanager receiver works the same way (discord_configs, telegram_configs, webhook_configs, ...).
global:
  smtp_smarthost: smtp.gmail.com:587
  smtp_from: SIPPolusi alerts <sender@example.com>
  smtp_auth_username: sender@example.com
  smtp_auth_password_file: /etc/alertmanager/smtp/password
  smtp_require_tls: true

route:
  receiver: team
  group_by: [alertname, service_name, job, probe, pollutant]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers: ['alertname="Watchdog"']
      receiver: blackhole

receivers:
  - name: team
    email_configs:
      - to: team@example.com
        send_resolved: true
  - name: blackhole

inhibit_rules:
  - source_matchers: ['alertname="EndpointProbeFailed"']
    target_matchers: ['alertname=~"HighErrorRate|ErrorRateAboveTarget|RouteLatencyP95.*"']
