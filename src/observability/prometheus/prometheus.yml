global:
  scrape_interval: 15s

scrape_configs:
  # "backend" resolves via Docker Compose service DNS locally/in CI; on
  # Railway this target name is replaced with backend.railway.internal.
  - job_name: backend
    static_configs:
      - targets: ["backend:8000"]

  - job_name: data_worker
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: pushgateway
    static_configs:
      - targets: ["pushgateway:9091"]
