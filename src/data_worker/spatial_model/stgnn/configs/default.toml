[model]
temporal_channels = 34
local_channels = 10
hidden_channels = 32
local_hidden_channels = 16
heads = 4
kernel_size = 3
dilations = [1, 2, 4]
dropout = 0.1
use_graph = true
use_local = true

[training]
seed = 42
epochs = 200
batch_size = 4
learning_rate = 0.001
weight_decay = 0.0001
patience = 20
gradient_clip = 1.0
