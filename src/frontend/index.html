<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cari rute jalan kaki atau sepeda dengan estimasi paparan polusi udara lebih rendah. Estimasi model, bukan rekomendasi medis."
      data-en-content="Find walking or cycling routes with lower estimated air-pollution exposure. Model estimates, not medical advice."
    />
    <title>SIPPolusi</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <!-- The splash screen's logo is needed before anything else is painted. -->
    <link rel="preload" as="image" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Splash screen while the app and map load; main.ts fades it out (style.css "splash"). -->
    <div class="splash" id="splash" role="status" aria-label="Memuat SIPPolusi" data-en-aria-label="Loading SIPPolusi">
      <div class="splash-inner">
        <img class="splash-logo" src="/logo.png" alt="" width="132" height="132" />
        <p class="splash-name">SIPPolusi</p>
        <p class="splash-tagline" data-en="Low-exposure routes in Jakarta">Rute rendah paparan di Jakarta</p>
        <span class="splash-bar" aria-hidden="true"></span>
      </div>
    </div>
    <div class="app" id="app">
      <aside class="panel" id="panel" aria-label="Panel rute" data-en-aria-label="Route panel">
        <button
          type="button"
          class="sheet-handle"
          id="sheet-handle"
          aria-expanded="true"
          aria-controls="panel-body"
          aria-label="Ciutkan panel"
        ></button>

        <header class="brand">
          <img class="brand-mark" src="/logo.png" alt="" width="34" height="34" />
          <span class="brand-text">
            <span class="brand-name">SIPPolusi</span>
            <span class="brand-sub">Jakarta</span>
          </span>
          <div class="lang-switch" role="group" aria-label="Bahasa / Language">
            <button type="button" class="lang-btn" data-lang="id" lang="id" aria-pressed="true" title="Bahasa Indonesia">ID</button>
            <button type="button" class="lang-btn" data-lang="en" lang="en" aria-pressed="false" title="English">EN</button>
          </div>
        </header>

        <div class="panel-body" id="panel-body">
          <!-- Shown only while navigating (style.css): the search below is locked until it ends. -->
          <p class="nav-lock-note" role="note" data-en="End navigation to search for another route.">Akhiri navigasi untuk mencari rute lain.</p>

          <!-- Form view: trip input (Gambar 3.1a / 3.3) -->
          <section id="form-view" aria-labelledby="form-title">
            <h1 id="form-title" class="visually-hidden" data-en="Where to?">Mau ke mana?</h1>

            <form id="trip-form" novalidate>
              <div class="points">
                <div class="point-fields">
                  <div class="field" id="field-origin">
                    <label for="input-origin"><span class="dot dot-origin" aria-hidden="true"></span><span data-en="From">Asal</span></label>
                    <div class="field-row">
                      <input
                        id="input-origin"
                        name="origin"
                        type="text"
                        role="combobox"
                        aria-autocomplete="list"
                        aria-expanded="false"
                        aria-controls="list-origin"
                        autocomplete="off"
                        spellcheck="false"
                        placeholder="Cari tempat atau klik peta"
                        data-en-placeholder="Search a place or click the map"
                        aria-describedby="error-origin"
                      />
                      <button type="button" class="clear-btn" id="clear-origin" hidden aria-label="Hapus titik asal" data-en-aria-label="Clear the starting point" title="Hapus" data-en-title="Clear"></button>
                      <button type="button" class="pick-btn" id="pick-origin" aria-pressed="false" aria-label="Pilih titik asal di peta" data-en-aria-label="Pick the starting point on the map" title="Pilih di peta" data-en-title="Pick on map"></button>
                    </div>
                    <p class="field-error" id="error-origin" role="alert" hidden></p>
                    <div class="place-menu" id="menu-origin" hidden>
                      <ul id="list-origin" role="listbox" aria-label="Saran tempat asal" data-en-aria-label="Starting point suggestions" hidden></ul>
                      <p class="place-status" id="status-origin" role="status" hidden></p>
                    </div>
                  </div>

                  <div class="field" id="field-destination">
                    <label for="input-destination"><span class="dot dot-destination" aria-hidden="true"></span><span data-en="To">Tujuan</span></label>
                    <div class="field-row">
                      <input
                        id="input-destination"
                        name="destination"
                        type="text"
                        role="combobox"
                        aria-autocomplete="list"
                        aria-expanded="false"
                        aria-controls="list-destination"
                        autocomplete="off"
                        spellcheck="false"
                        placeholder="Cari tempat atau klik peta"
                        data-en-placeholder="Search a place or click the map"
                        aria-describedby="error-destination"
                      />
                      <button type="button" class="clear-btn" id="clear-destination" hidden aria-label="Hapus titik tujuan" data-en-aria-label="Clear the destination" title="Hapus" data-en-title="Clear"></button>
                      <button type="button" class="pick-btn" id="pick-destination" aria-pressed="false" aria-label="Pilih titik tujuan di peta" data-en-aria-label="Pick the destination on the map" title="Pilih di peta" data-en-title="Pick on map"></button>
                    </div>
                    <p class="field-error" id="error-destination" role="alert" hidden></p>
                    <div class="place-menu" id="menu-destination" hidden>
                      <ul id="list-destination" role="listbox" aria-label="Saran tempat tujuan" data-en-aria-label="Destination suggestions" hidden></ul>
                      <p class="place-status" id="status-destination" role="status" hidden></p>
                    </div>
                  </div>
                </div>
                <button type="button" class="icon-btn swap-btn" id="swap-btn" aria-label="Tukar asal dan tujuan" data-en-aria-label="Swap start and destination"></button>
              </div>
              <button type="button" class="link-btn" id="use-location" data-en="Use my location as the start">Gunakan lokasi saya sebagai asal</button>
              <p class="visually-hidden" id="pick-hint" aria-live="polite"></p>

              <fieldset class="mode">
                <legend data-en="Mode">Moda</legend>
                <div class="segmented">
                  <label class="seg"><input type="radio" name="mode" value="walk" checked /><span id="mode-walk-label"></span></label>
                  <label class="seg"><input type="radio" name="mode" value="bike" /><span id="mode-bike-label"></span></label>
                </div>
              </fieldset>

              <div class="priority">
                <div class="priority-head">
                  <label for="priority" data-en="Trip priority">Prioritas perjalanan</label>
                </div>
                <input
                  id="priority"
                  type="range"
                  min="0"
                  max="1"
                  step="0.05"
                  value="0.5"
                  aria-describedby="priority-text"
                />
                <div class="priority-scale" aria-hidden="true">
                  <span data-en="Faster">Lebih cepat</span><span data-en="Balanced">Seimbang</span><span data-en="Cleaner">Lebih bersih</span>
                </div>
                <p class="visually-hidden" id="priority-text"></p>
              </div>

              <div id="form-status" class="status" aria-live="polite" aria-atomic="true"></div>

              <button type="submit" class="primary" id="submit-btn" aria-describedby="submit-help">Cari rute</button>
              <p class="hint" id="submit-help"></p>
              <button type="button" class="secondary" id="cancel-btn" hidden data-en="Cancel">Batalkan</button>
            </form>
          </section>

          <!-- Result view: comparison (Gambar 3.1b / 3.4) -->
          <section id="result-view" hidden aria-labelledby="result-title"></section>

        </div>

        <!-- Credits for the map, its data and the air-quality sources (filled in by main.ts) -->
        <footer class="panel-credits" id="panel-credits"></footer>
      </aside>
      <!-- Desktop: slides the panel out of the way and back (main.ts) -->
      <button type="button" class="panel-toggle" id="panel-toggle" aria-controls="panel" aria-expanded="true"></button>

      <main class="map-wrap">
        <div id="map" aria-label="Peta rute dan heatmap paparan" data-en-aria-label="Map of routes and exposure heatmap"></div>

        <!-- Navigation view over the map: GPS tracking along the chosen route (TI-SE-13) -->
        <section id="nav-view" hidden aria-label="Navigasi" data-en-aria-label="Navigation"></section>

        <div class="map-buttons">
          <button type="button" class="map-btn" id="heat-toggle" aria-pressed="false" aria-label="Tampilkan heatmap paparan" title="Heatmap paparan" data-en-title="Exposure heatmap"></button>
          <button type="button" class="map-btn" id="locate-btn" aria-label="Tampilkan lokasi saya" title="Lokasi saya"></button>
        </div>

        <section class="legend" id="legend" aria-label="Legenda peta" data-en-aria-label="Map legend" hidden></section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
