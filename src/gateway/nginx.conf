# SIPPolusi API Gateway (NGINX custom). Per-request routing lives in
# templates/default.conf.template, rendered to /etc/nginx/conf.d/ at start.
worker_processes auto;

# Railway tags stderr as error, so only warnings and worse go there.
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
