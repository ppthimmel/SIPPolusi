# Stub upstreams for tests/run.sh. Each answers with its name, the request URI
# it received and the X-Request-ID the gateway sent, so a test can tell which
# upstream a path reached and that the request was passed unchanged.
server {
    listen 127.0.0.1:9001;
    access_log off;
    default_type text/plain;
    add_header X-Seen-Received-At $http_x_request_received_at always;
    add_header X-Request-ID $http_x_request_id always;  # like the real upstreams
    return 200 "backend $request_uri $http_x_request_id";
}

server {
    listen 127.0.0.1:9002;
    access_log off;
    default_type text/plain;
    add_header X-Seen-Received-At $http_x_request_received_at always;
    add_header X-Request-ID $http_x_request_id always;  # like the real upstreams
    return 200 "cache_api $request_uri $http_x_request_id";
}
