# Stub Cache API for tests/run.sh. It answers with its name, the request URI it
# received and the X-Request-ID the gateway sent, so a test can tell that a path
# reached it and in which form.
server {
    listen 127.0.0.1:9002;
    access_log off;
    default_type text/plain;
    add_header X-Seen-Received-At $http_x_request_received_at always;
    add_header X-Request-ID $http_x_request_id always;  # like the real upstreams
    return 200 "cache_api $request_uri $http_x_request_id";
}
