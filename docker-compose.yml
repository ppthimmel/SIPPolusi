# Local development / CI stack for all SIPPolusi services. Mirrors the
# Railway deployment topology: the NGINX API Gateway (src/gateway) is the
# public entry point for /v1/* on :8081 and the only place that maps paths to
# services (backend, cache_api). The frontend container hands its /v1/* to the
# gateway unchanged (src/frontend/default.conf.template).
# Build/start guide and smoke test: docs/devops/build-runtime.md.
services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    env_file: ./src/postgres/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # minio/minio is no longer pullable without a Docker Hub login (MinIO Inc.
  # moved AGPL community images behind auth); bitnamilegacy is the free
  # community-maintained mirror and supports MINIO_DEFAULT_BUCKETS directly.
  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    env_file: ./src/minio/.env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  model_registry:
    build: ./src/model_registry
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: ./src/model_registry/.env
    ports:
      - "5000:5000"

  backend:
    build: ./src/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      model_registry:
        condition: service_started
    env_file: ./src/backend/.env
    ports:
      - "8000:8000"
    healthcheck:
      # Liveness only; GET /health/ready also checks the database.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cache API (/v1/osm, /v1/pollution): same source tree as the backend, own
  # image and process. Health check is built into the image (GET /health).
  cache_api:
    build:
      context: ./src/backend
      dockerfile: osm/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./src/backend/.env
    environment:
      PORT: "8000"
    ports:
      - "8001:8000"

  gateway:
    build: ./src/gateway
    restart: unless-stopped
    env_file: ./src/gateway/.env
    depends_on:
      backend:
        condition: service_healthy
      cache_api:
        condition: service_healthy
    ports:
      - "8081:8080"

  data_worker:
    build: ./src/data_worker
    volumes:
      # Training inputs are excluded from the image; expose processed features read-only locally.
      - ./src/data_worker/dataset_processed:/app/dataset_processed:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      model_registry:
        condition: service_started
    env_file: ./src/data_worker/.env
    # Image default is `python main.py cycle` (one cycle then exit, for the
    # Railway cron in railway.json). With restart: unless-stopped that would
    # rerun a full SPKU sweep every few minutes, so run the in-process
    # scheduler instead: one cycle now, then every hour at minute 15.
    command: ["python", "main.py", "serve", "--now"]

  frontend:
    build: ./src/frontend
    restart: unless-stopped
    env_file: ./src/frontend/.env
    depends_on:
      - gateway
    ports:
      - "8080:80"

  prometheus:
    build: ./src/observability/prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"

  pushgateway:
    build: ./src/observability/pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"

  grafana:
    build: ./src/observability/grafana
    restart: unless-stopped
    env_file: ./src/observability/.env
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
